name: ci
# Owner's rule (~/.claude/CLAUDE.md, 2026-10-07): until 2026-11-01 this
# private repo runs CI on Linux only -- macOS bills 10x per minute and used
# most of the account's included minutes -- pull_request is dropped because
# it double-runs a push, and a newer run on the same ref cancels an older one.
# The full gate still runs on this Mac before every push.
on: [push, workflow_dispatch]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Turn "ssh-agent is not installed" from a skip into a failure: the
      # agent client is hand-written, and the real-agent tests are what make
      # that defensible. They must not quietly stop running.
      NORN_REQUIRE_SSH_AGENT: "1"
      # The tmpfs tests (state_dir warnings, durable.Volatile) can run only on
      # Linux, and only here; a skip on this job is a failure.
      NORN_REQUIRE_TMPFS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make ci
      - run: make lint

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: install the reference implementation's one dependency
        run: python3 -m venv contrib/norn-ref/.venv && contrib/norn-ref/.venv/bin/pip install -q pynacl
      - name: reference unit tests
        run: make ref-test
      - name: committed vectors match their generators
        run: make vectors-check
