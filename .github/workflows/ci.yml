name: ci
on: [push, pull_request]
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make ci
      - run: make lint

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: install the reference implementation's one dependency
        run: python3 -m venv contrib/norn-ref/.venv && contrib/norn-ref/.venv/bin/pip install -q pynacl
      - name: reference unit tests
        run: make ref-test
      - name: committed vectors match their generators
        run: make vectors-check
