name: ci
# Linux only, by the owner's Actions-budget rule (~/.claude/CLAUDE.md,
# 2026-10-07): macOS bills 10x per minute and once used most of the account's
# included minutes. The repository went public on 2026-10-17, where Actions
# runs free; the rule is reviewed on 2026-11-01 and nothing here changes before
# then. pull_request is dropped because it double-runs a push, and a newer run
# on the same ref cancels an older one. The full gate still runs on the
# owner's Mac before every push, and `make vet` and `make lint` there read the
# Linux build too.
# The actions are their v7 majors, all on Node 24 (checked against each
# action.yml and its release notes, 2026-10-08; a docclaims test holds it).
on: [push, workflow_dispatch]
# The job token reads the repository and nothing else; no step writes.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Turn "ssh-agent is not installed" from a skip into a failure: the
      # agent client is hand-written, and the real-agent tests are what make
      # that defensible. They must not quietly stop running.
      NORN_REQUIRE_SSH_AGENT: "1"
      # The tmpfs tests (state_dir warnings, durable.Volatile) can run only on
      # Linux, and only here; a skip on this job is a failure.
      NORN_REQUIRE_TMPFS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: make ci
      - run: make lint

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - name: install the reference implementation's one dependency
        run: python3 -m venv contrib/norn-ref/.venv && contrib/norn-ref/.venv/bin/pip install -q pynacl
      - name: reference unit tests
        run: make ref-test
      - name: committed vectors match their generators
        run: make vectors-check

  lab-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: make lab-sim
